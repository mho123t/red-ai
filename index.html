<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تقييم ريدان للمندي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #3a101b; /* لون عنابي داكن فخم */
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Tajawal', 'Poppins', sans-serif;
            position: relative;
            cursor: pointer; /* إشارة للتفاعل */
        }

        /* إضاءات وأضواء متحركة فخمة جداً في الخلفية */
        .bg-lights {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .light {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: moveLight 8s infinite alternate ease-in-out;
        }

        .light-1 {
            width: 60vmax;
            height: 60vmax;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.3), transparent 70%);
            top: -20%;
            left: -10%;
            animation-duration: 12s;
        }

        .light-2 {
            width: 50vmax;
            height: 50vmax;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2), transparent 70%);
            bottom: -20%;
            right: -10%;
            animation-duration: 15s;
            animation-delay: 2s;
        }

        .light-3 {
            width: 40vmax;
            height: 40vmax;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseLight 4s infinite alternate;
        }

        @keyframes moveLight {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(15%, 15%) scale(1.2); }
        }

        @keyframes pulseLight {
            0% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.3); }
        }

        /* الحاوية الأساسية */
        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 800px;
            height: 80vh;
            max-height: 750px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 60px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: inset 0 0 80px rgba(212, 175, 55, 0.05), 0 20px 60px rgba(0,0,0,0.6);
            transition: box-shadow 0.5s ease;
        }

        .container:hover {
            box-shadow: inset 0 0 100px rgba(212, 175, 55, 0.1), 0 25px 80px rgba(0,0,0,0.8), 0 0 40px rgba(212, 175, 55, 0.3);
        }

        /* النصوص المتحركة الفخمة */
        .text-container {
            text-align: center;
            margin-top: -30px;
        }

        .arabic-title {
            font-family: 'Tajawal', sans-serif;
            font-weight: 900;
            font-size: 4.5rem;
            background: linear-gradient(135deg, #fff 0%, #D4AF37 30%, #fff 50%, #D4AF37 70%, #fff 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerText 4s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            margin-bottom: 5px;
        }

        .english-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 2.2rem;
            color: #f5f5f5;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: fadeUp 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .sub-title {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 15px;
            animation: fadeUp 1.2s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .sub-title .ar {
            font-family: 'Tajawal', sans-serif;
            color: #ccb699;
            font-size: 1.6rem;
            letter-spacing: 1px;
        }

        .sub-title .en {
            font-family: 'Poppins', sans-serif;
            color: #aa9b84;
            font-size: 1.2rem;
        }

        @keyframes shimmerText {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* صندوق QR Code فخم */
        .qr-wrapper {
            background: #ffffff;
            padding: 25px;
            border-radius: 40px;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.4), 0 0 120px rgba(212, 175, 55, 0.2);
            animation: floatBox 3s ease-in-out infinite;
            position: relative;
        }

        .qr-wrapper::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 44px;
            background: linear-gradient(135deg, #D4AF37, #f9d976, #b58d25);
            z-index: -1;
            background-size: 300% 300%;
            animation: shimmerBorder 3s infinite linear;
        }

        @keyframes floatBox {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shimmerBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #qrcode img {
            display: block;
            width: 250px;
            height: 250px;
        }

        /* التعليمات أسفل الكود */
        .tap-hint {
            margin-top: 5px;
            font-size: 1.4rem;
            color: #D4AF37;
            font-weight: 300;
            animation: blinkText 2s infinite;
        }

        .tap-hint small {
            display: block;
            color: #a08b72;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            margin-top: 5px;
        }

        @keyframes blinkText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 768px) {
            .arabic-title { font-size: 2.8rem; }
            .english-title { font-size: 1.5rem; }
            .container { height: auto; padding: 40px 20px; border-radius: 30px; }
            #qrcode img { width: 180px; height: 180px; }
            .qr-wrapper { padding: 15px; }
            .sub-title .ar { font-size: 1.2rem; }
            .sub-title .en { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- إضاءة خلفية متحركة -->
    <div class="bg-lights">
        <div class="light light-1"></div>
        <div class="light light-2"></div>
        <div class="light light-3"></div>
    </div>

    <!-- المحتوى الفاخر -->
    <div class="container" id="mainContainer">
        
        <div class="text-container">
            <div class="arabic-title">ريدان للمندي</div>
            <div class="english-title">Raidan Mandi Restaurant</div>
            <div class="sub-title">
                <span class="ar">شاركنا تجربتك لنكون الأفضل</span>
                <span class="en">Share your feedback with us</span>
            </div>
        </div>

        <!-- كود QR فاخر -->
        <div class="qr-wrapper" id="qrWrapper">
            <div id="qrcode"></div>
        </div>
        
        <div class="tap-hint">
            ✦ امسح الكود لبدء التقييم ✦
            <small>Scan the code to rate us</small>
        </div>

    </div>

    <script>
        // 1. توليد كود QR
        var qrcode = new QRCode(document.getElementById("qrcode"), {
            text: "https://share.google/I5qRSbag9rFWj1iw1",
            width: 250,
            height: 250,
            colorDark: "#3a101b",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // 2. تفعيل الصوت (شكراً لكم) عند الضغط على الشاشة
        // ملاحظة: المتصفحات تمنع تشغيل الصوت التلقائي عند التحميل، لذلك يجب أن يتم تشغيله عبر تفاعل المستخدم.
        function playThankYou() {
            if ('speechSynthesis' in window) {
                // إيقاف أي كلام سابق لمنع التداخل
                window.speechSynthesis.cancel();
                
                let utterance = new SpeechSynthesisUtterance('شكراً لكم');
                utterance.lang = 'ar-SA'; // تحديد اللغة العربية
                utterance.rate = 0.9; // سرعة الكلام (أقل قليلاً للفخامة)
                utterance.pitch = 1.1; // نبرة الصوت
                utterance.volume = 1; // مستوى الصوت
                
                window.speechSynthesis.speak(utterance);
            } else {
                console.log("المتصفح لا يدعم خاصية النطق الصوتي.");
            }
        }

        // تشغيل الصوت عند أول نقرة/لمسة على الشاشة
        document.body.addEventListener('click', function() {
            playThankYou();
        }, { once: false }); // { once: false } يعني تشغيله في كل ضغطة للاحتياط، أو يمكن تركه بدون once.

        // تشغيله أيضاً عند الضغط على مربع الـ QR تحديداً
        document.getElementById('qrWrapper').addEventListener('click', function(e) {
            e.stopPropagation(); // منع التكرار
            playThankYou();
        });
        
        // تشغيل الصوت أيضاً عند اللمس (للحواسيب اللوحية)
        document.body.addEventListener('touchstart', function() {
            playThankYou();
        });
    </script>

</body>
</html>
