<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تقييم ريدان للمندي | Raidan Mandi</title>
    <!-- خطوط عربية وإنجليزية فاخرة -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة توليد QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #4e1721; /* لون عنابي مطابق للشعار */
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* تثبيت الصفحة لمنع التمرير */
            font-family: 'Tajawal', 'Poppins', sans-serif;
        }

        .container {
            width: 90%;
            max-width: 900px;
            height: 90vh;
            max-height: 850px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(212, 175, 55, 0.05);
            position: relative;
        }

        /* تأثير توهج ذهبي خلفي */
        .container::before {
            content: '';
            position: absolute;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, transparent 70%);
            top: 10%;
            left: 20%;
            z-index: -1;
            pointer-events: none;
        }

        /* قسم الشعار */
        .header-section {
            text-align: center;
            margin-bottom: 10px;
        }

        .arabic-title {
            font-family: 'Tajawal', sans-serif;
            font-weight: 900;
            font-size: 4rem;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }

        .english-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 2rem;
            color: #D4AF37;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sub-title {
            color: #ccb699;
            font-size: 1.4rem;
            margin-top: 10px;
            font-weight: 300;
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
        }

        .sub-title span {
            display: inline-block;
        }
        
        .sub-title .ar { font-family: 'Tajawal', sans-serif; }
        .sub-title .en { font-family: 'Poppins', sans-serif; font-size: 1.2rem; }

        /* صندوق الـ QR Code */
        .qr-wrapper {
            background: #ffffff;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), 0 0 0 4px rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* النص أسفل الـ QR Code */
        .qr-instructions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #e0d7c5;
            font-size: 1.5rem;
            margin-top: 10px;
            font-family: 'Tajawal', 'Poppins', sans-serif;
        }
        .qr-instructions small {
            font-size: 1rem;
            opacity: 0.7;
        }

        /* زر بديل للضغط على الآيباد */
        .tap-btn {
            background: linear-gradient(135deg, #D4AF37, #b58d25);
            color: #1a1a1a;
            font-family: 'Tajawal', 'Poppins', sans-serif;
            padding: 20px 50px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
            margin-top: 10px;
            width: 100%;
            max-width: 500px;
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .tap-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 50px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #f9d976, #D4AF37);
        }
        .tap-btn:active { transform: scale(0.95); }

        @media (max-width: 768px) {
            .arabic-title { font-size: 2.5rem; }
            .english-title { font-size: 1.2rem; }
            .sub-title { font-size: 1rem; flex-direction: column; gap: 5px; }
            .sub-title .en { font-size: 1rem; }
            .container { height: auto; padding: 30px 20px; max-height: none; border-radius: 30px; }
            .tap-btn { font-size: 1.2rem; padding: 15px 25px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- قسم العنوان بالعربي والإنجليزي -->
        <div class="header-section">
            <div class="arabic-title">ريدان للمندي</div>
            <div class="english-title">Raidan Mandi Restaurant</div>
            <div class="sub-title">
                <span class="ar">قيم تجربتك معنا</span>
                <span style="color:#D4AF37;">✦</span>
                <span class="en">Rate your experience</span>
            </div>
        </div>

        <!-- صندوق رمز الاستجابة السريعة (QR Code) -->
        <div class="qr-wrapper">
            <div id="qrcode"></div>
        </div>
        
        <!-- نص إضافي -->
        <div class="qr-instructions">
            <span style="font-family: 'Tajawal', sans-serif;">امسح الكود أو اضغط على الزر</span>
            <small style="font-family: 'Poppins', sans-serif;">Scan the code or tap below</small>
        </div>

        <!-- زر ضخم للزبائن ليسهل عليهم التقييم من الآيباد (ضغطة واحدة) -->
        <a href="https://share.google/I5qRSbag9rFWj1iw1" target="_blank" rel="noopener noreferrer" class="tap-btn">
            🌟 قيمنا الآن / Rate Now
        </a>

    </div>

    <!-- سكريبت جافا سكريبت لتوليد QR Code -->
    <script>
        // يستخدم الرابط الذي أرسلته لتوليد الكود
        var qrcode = new QRCode(document.getElementById("qrcode"), {
            text: "https://share.google/I5qRSbag9rFWj1iw1",
            width: 240,  // الحجم مناسب للايباد
            height: 240,
            colorDark: "#4e1721", // لون العنابي للمطعم
            colorLight: "#ffffff", // خلفية بيضاء
            correctLevel: QRCode.CorrectLevel.H // أعلى مستوى للتصحيح لتجنب الأخطاء
        });
    </script>

</body>
</html>
