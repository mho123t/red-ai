<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الفواتير الذكية</title>

<style>

/* =========================
   التصميم العام
========================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0a0a0c;
  color: white;
  font-family: Arial, Tahoma, sans-serif;
}

/* =========================
   الهيدر
========================= */

.topbar {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 22px;
  background: #111113;
  border-bottom: 1px solid #3b301b;
}

.logo {
  width: 50px;
  height: 50px;
  border-radius: 15px;
  background: linear-gradient(135deg, #e0c067, #9b7527);
  color: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 28px;
  font-weight: bold;
}

.topbar h1 {
  margin: 0;
  font-size: 25px;
}

.topbar p {
  margin: 6px 0 0;
  color: #aaa;
}

/* =========================
   المحتوى
========================= */

main {
  width: min(1000px, 94%);
  margin: auto;
}

.hero {
  text-align: center;
  padding: 45px 15px 30px;
}

.hero h2 {
  font-size: 30px;
  margin-bottom: 10px;
}

.hero p {
  color: #aaa;
}

/* =========================
   زر التصوير
========================= */

.upload-btn {
  display: inline-block;
  margin-top: 25px;
  padding: 17px 30px;
  border-radius: 15px;
  background: linear-gradient(135deg, #e0c067, #a77f2d);
  color: #111;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 8px 30px rgba(216,182,93,0.15);
}

.upload-btn:hover {
  transform: translateY(-2px);
}

/* =========================
   الإحصائيات
========================= */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 25px;
}

.stats div {
  background: #141416;
  border: 1px solid #29292c;
  border-radius: 16px;
  padding: 18px;
  text-align: center;
}

.stats strong {
  display: block;
  color: #d8b65d;
  font-size: 27px;
}

.stats span {
  display: block;
  margin-top: 6px;
  color: #999;
}

/* =========================
   الأقسام
========================= */

.section {
  background: #111113;
  border: 1px solid #29292c;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 25px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.section-title h2 {
  margin: 0;
}

/* =========================
   الفواتير
========================= */

.invoice-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 15px;
}

.invoice-card {
  overflow: hidden;
  background: #18181a;
  border: 1px solid #303034;
  border-radius: 16px;
}

.invoice-card img {
  width: 100%;
  height: 250px;
  object-fit: contain;
  background: #eee;
  display: block;
}

.invoice-info {
  padding: 13px;
}

.invoice-number {
  color: #d8b65d;
  font-weight: bold;
}

.invoice-actions {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

.invoice-actions button {
  flex: 1;
  border: 0;
  padding: 9px;
  border-radius: 9px;
  cursor: pointer;
}

.scan-btn {
  background: #d8b65d;
  color: #111;
}

.delete-btn {
  background: #342326;
  color: #ff9d9d;
}

/* =========================
   الأزرار
========================= */

.gold-btn,
.dark-btn {
  border: 0;
  border-radius: 10px;
  padding: 11px 15px;
  cursor: pointer;
  font-weight: bold;
}

.gold-btn {
  background: #d8b65d;
  color: #111;
}

.dark-btn {
  background: #29292c;
  color: white;
}

/* =========================
   الموظفات
========================= */

.employee {
  background: #18181a;
  border: 1px solid #303034;
  border-radius: 17px;
  padding: 18px;
  margin-bottom: 15px;
}

.employee-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
}

.employee-name {
  font-size: 18px;
  font-weight: bold;
}

.employee-count {
  color: #d8b65d;
}

.employee-invoices {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}

.employee-invoice {
  background: #101012;
  border-radius: 10px;
  padding: 7px;
}

.employee-invoice img {
  width: 100%;
  height: 130px;
  object-fit: contain;
  background: #eee;
  border-radius: 7px;
}

.employee-invoice p {
  text-align: center;
  color: #bbb;
}

/* =========================
   الإرسال
========================= */

.send-section {
  text-align: center;
  padding: 30px 20px 50px;
}

.send-section p {
  color: #aaa;
}

.send-all {
  width: 100%;
  max-width: 500px;
  padding: 18px;
  border: 0;
  border-radius: 15px;
  background: #25d366;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.send-status {
  margin-top: 20px;
  color: #bbb;
}

.hidden {
  display: none;
}

/* =========================
   الفوتر
========================= */

footer {
  text-align: center;
  padding: 30px;
  color: #666;
}

/* =========================
   الجوال
========================= */

@media (max-width: 600px) {

  .stats {
    grid-template-columns: repeat(3, 1fr);
  }

  .stats div {
    padding: 13px 5px;
  }

  .stats strong {
    font-size: 21px;
  }

  .section-title {
    flex-direction: column;
    align-items: stretch;
  }

  .section-title button {
    width: 100%;
  }

  .hero h2 {
    font-size: 25px;
  }

}

</style>
</head>


<body>


<!-- =========================
     الهيدر
========================= -->

<header class="topbar">

  <div class="logo">
    ✦
  </div>

  <div>

    <h1>
      الفواتير الذكية
    </h1>

    <p>
      صوّر • رتّب • قسّم • أرسل
    </p>

  </div>

</header>



<main>


<!-- =========================
     الواجهة الرئيسية
========================= -->

<section class="hero">

  <h2>
    إدارة الفواتير بسهولة
  </h2>

  <p>
    صوّر جميع الفواتير وسيتم تجهيزها وتوزيعها على الموظفات.
  </p>


  <label class="upload-btn">

    📸 تصوير / اختيار الفواتير

    <input
      id="fileInput"
      type="file"
      accept="image/*"
      capture="environment"
      multiple
      hidden
    >

  </label>

</section>



<!-- =========================
     الإحصائيات
========================= -->

<section class="stats">

  <div>

    <strong id="invoiceCount">
      0
    </strong>

    <span>
      الفواتير
    </span>

  </div>


  <div>

    <strong>
      3
    </strong>

    <span>
      الموظفات
    </span>

  </div>


  <div>

    <strong id="readyCount">
      0
    </strong>

    <span>
      جاهزة
    </span>

  </div>

</section>



<!-- =========================
     قسم الفواتير
========================= -->

<section
  id="invoiceSection"
  class="section hidden"
>

  <div class="section-title">

    <h2>
      🧾 الفواتير
    </h2>


    <button
      id="scanAllBtn"
      class="gold-btn"
    >

      ✨ تحسين Scan

    </button>

  </div>


  <div
    id="invoiceGrid"
    class="invoice-grid"
  ></div>

</section>



<!-- =========================
     قسم الموظفات
========================= -->

<section
  id="employeesSection"
  class="section hidden"
>

  <div class="section-title">

    <h2>
      👩‍💼 توزيع الموظفات
    </h2>


    <button
      id="redistributeBtn"
      class="dark-btn"
    >

      🔄 إعادة التوزيع

    </button>

  </div>


  <div id="employees"></div>

</section>



<!-- =========================
     قسم الإرسال
========================= -->

<section
  id="sendSection"
  class="send-section hidden"
>

  <h2>
    📱 إرسال الفواتير
  </h2>

  <p>
    كل موظفة تستلم فواتيرها فقط.
  </p>


  <button
    id="sendAllBtn"
    class="send-all"
  >

    🟢 إرسال الكل عبر واتساب

  </button>


  <div
    id="sendStatus"
    class="send-status"
  ></div>

</section>


</main>



<footer>

  نظام الفواتير الذكي

</footer>



<script>

/* ========================================
   بيانات الموظفات
======================================== */

const employees = [

  {
    id: 1,
    name: "موزه الكعبي",
    phone: "971XXXXXXXXX"
  },

  {
    id: 2,
    name: "حصه الكعبي",
    phone: "971XXXXXXXXX"
  },

  {
    id: 3,
    name: "مريم الكعبي",
    phone: "971XXXXXXXXX"
  }

];



/* ========================================
   المتغيرات
======================================== */

let invoices = [];

let assignments = {

  1: [],
  2: [],
  3: []

};



/* ========================================
   العناصر
======================================== */

const fileInput =
  document.getElementById("fileInput");

const invoiceGrid =
  document.getElementById("invoiceGrid");



/* ========================================
   رفع / تصوير الفواتير
======================================== */

fileInput.addEventListener(
  "change",
  async function () {

    const files =
      Array.from(this.files);


    for (const file of files) {

      if (!file.type.startsWith("image/")) {
        continue;
      }


      const image =
        await fileToDataURL(file);


      invoices.push({

        id: invoices.length + 1,

        original: image,

        processed: image,

        scanned: false

      });

    }


    renderInvoices();

    distributeInvoices();


    this.value = "";

  }
);



/* ========================================
   تحويل الصورة إلى Data URL
======================================== */

function fileToDataURL(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => resolve(reader.result);


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}



/* ========================================
   عرض الفواتير
======================================== */

function renderInvoices() {

  invoiceGrid.innerHTML = "";


  invoices.forEach(invoice => {

    const card =
      document.createElement("div");


    card.className =
      "invoice-card";


    card.innerHTML = `

      <img src="${invoice.processed}">

      <div class="invoice-info">

        <div class="invoice-number">

          فاتورة
          ${String(invoice.id).padStart(3, "0")}

        </div>

        <div class="invoice-actions">

          <button
            class="scan-btn"
            onclick="scanInvoice(${invoice.id})"
          >

            ✨ Scan

          </button>


          <button
            class="delete-btn"
            onclick="deleteInvoice(${invoice.id})"
          >

            حذف

          </button>

        </div>

      </div>

    `;


    invoiceGrid.appendChild(card);

  });


  updateStats();


  if (invoices.length > 0) {

    document
      .getElementById("invoiceSection")
      .classList.remove("hidden");


    document
      .getElementById("employeesSection")
      .classList.remove("hidden");


    document
      .getElementById("sendSection")
      .classList.remove("hidden");

  }

}



/* ========================================
   تحسين Scan لفاتورة واحدة
======================================== */

function scanInvoice(id) {

  const invoice =
    invoices.find(
      x => x.id === id
    );


  if (!invoice) {
    return;
  }


  processScan(invoice);

}



/* ========================================
   معالجة الصورة
======================================== */

function processScan(invoice) {

  const img =
    new Image();


  img.onload =
    function () {

      const canvas =
        document.createElement("canvas");


      const ctx =
        canvas.getContext("2d");


      canvas.width =
        img.width;


      canvas.height =
        img.height;


      ctx.filter =
        "contrast(1.12) brightness(1.04) saturate(0.85)";


      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );


      invoice.processed =
        canvas.toDataURL(
          "image/jpeg",
          0.92
        );


      invoice.scanned =
        true;


      renderInvoices();

      distributeInvoices();

    };


  img.src =
    invoice.original;

}



/* ========================================
   تحسين جميع الفواتير
======================================== */

document
  .getElementById("scanAllBtn")
  .addEventListener(
    "click",
    function () {

      invoices.forEach(
        invoice => {

          processScan(invoice);

        }
      );

    }
  );



/* ========================================
   حذف فاتورة
======================================== */

function deleteInvoice(id) {

  invoices =
    invoices.filter(
      invoice =>
        invoice.id !== id
    );


  invoices.forEach(
    (invoice, index) => {

      invoice.id =
        index + 1;

    }
  );


  renderInvoices();

  distributeInvoices();


  if (invoices.length === 0) {

    document
      .getElementById("invoiceSection")
      .classList.add("hidden");


    document
      .getElementById("employeesSection")
      .classList.add("hidden");


    document
      .getElementById("sendSection")
      .classList.add("hidden");

  }

}



/* ========================================
   توزيع الفواتير بالتساوي
======================================== */

function distributeInvoices() {

  assignments = {

    1: [],
    2: [],
    3: []

  };


  invoices.forEach(
    (invoice, index) => {

      const employeeIndex =
        index % employees.length;


      const employee =
        employees[employeeIndex];


      assignments[
        employee.id
      ].push(invoice);

    }
  );


  renderEmployees();

}



/* ========================================
   عرض الموظفات
======================================== */

function renderEmployees() {

  const container =
    document.getElementById(
      "employees"
    );


  container.innerHTML = "";


  employees.forEach(
    employee => {

      const list =
        assignments[
          employee.id
        ] || [];


      const box =
        document.createElement("div");


      box.className =
        "employee";


      box.innerHTML = `

        <div class="employee-head">

          <div class="employee-name">

            👩‍💼
            ${employee.name}

          </div>

          <div class="employee-count">

            ${list.length}
            فاتورة

          </div>

        </div>


        <div class="employee-invoices">

          ${list.map(
            invoice => `

              <div
                class="employee-invoice"
              >

                <img
                  src="${invoice.processed}"
                >

                <p>

                  فاتورة
                  ${String(invoice.id)
                    .padStart(3, "0")}

                </p>

              </div>

            `
          ).join("")}

        </div>


        <button

          class="gold-btn"

          style="
            width:100%;
            margin-top:15px
          "

          onclick="
            sendEmployee(${employee.id})
          "
        >

          📱 إرسال للموظفة

        </button>

      `;


      container.appendChild(box);

    }
  );

}



/* ========================================
   إعادة التوزيع
======================================== */

document
  .getElementById(
    "redistributeBtn"
  )
  .addEventListener(
    "click",
    distributeInvoices
  );



/* ========================================
   إرسال موظفة واحدة إلى واتساب
======================================== */

function sendEmployee(employeeId) {

  const employee =
    employees.find(
      x => x.id === employeeId
    );


  const list =
    assignments[
      employeeId
    ] || [];


  if (list.length === 0) {

    alert(
      "لا توجد فواتير لهذه الموظفة."
    );

    return;

  }


  if (
    employee.phone.includes("X")
  ) {

    alert(
      "أضف رقم واتساب للموظفة أولاً."
    );

    return;

  }


  const message =

    `السلام عليكم ${employee.name}،\n` +

    `هذه فواتيرك الخاصة باليوم.\n` +

    `عدد الفواتير: ${list.length}`;


  const url =

    `https://wa.me/${employee.phone}` +

    `?text=${encodeURIComponent(message)}`;


  window.open(
    url,
    "_blank"
  );

}



/* ========================================
   إرسال الكل
======================================== */

async function sendAll() {

  const status =
    document.getElementById(
      "sendStatus"
    );


  status.innerHTML = "";


  for (
    const employee
    of employees
  ) {

    const list =
      assignments[
        employee.id
      ] || [];


    if (list.length === 0) {
      continue;
    }


    if (
      employee.phone.includes("X")
    ) {

      status.innerHTML +=

        `<p>
          ⚠️ ${employee.name}:
          أضف رقمها أولاً
        </p>`;

      continue;

    }


    status.innerHTML +=

      `<p>
        🟢 ${employee.name}
        — ${list.length} فاتورة
      </p>`;


    const message =

      `السلام عليكم ${employee.name}،\n` +

      `هذه فواتيرك الخاصة باليوم.\n` +

      `عدد الفواتير: ${list.length}`;


    const url =

      `https://wa.me/${employee.phone}` +

      `?text=${encodeURIComponent(message)}`;


    window.open(
      url,
      "_blank"
    );


    await wait(1500);

  }

}



/* ========================================
   زر إرسال الكل
======================================== */

document
  .getElementById(
    "sendAllBtn"
  )
  .addEventListener(
    "click",
    sendAll
  );



/* ========================================
   الانتظار
======================================== */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}



/* ========================================
   تحديث الإحصائيات
======================================== */

function updateStats() {

  document
    .getElementById(
      "invoiceCount"
    )
    .textContent =
    invoices.length;


  document
    .getElementById(
      "readyCount"
    )
    .textContent =

    invoices.filter(
      x => x.scanned
    ).length;

}

</script>

</body>
</html>
