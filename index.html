<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ريدان للمندي - Raidan Mandi</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #2f0c15;
            height: 100dvh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            font-family: 'Tajawal', 'Poppins', sans-serif;
            position: relative;
            cursor: pointer;
        }

        /* إضاءات خلفية فخمة */
        .bg-lights {
            position: absolute; inset: 0; overflow: hidden; z-index: 0; pointer-events: none;
        }
        .light {
            position: absolute; border-radius: 50%; filter: blur(10vmax); opacity: 0.5;
            animation: moveLight 12s infinite alternate ease-in-out;
        }
        .light-1 { width: 70vmax; height: 70vmax; background: radial-gradient(circle, rgba(212, 175, 55, 0.25), transparent 70%); top: -30%; left: -20%; animation-duration: 15s; }
        .light-2 { width: 60vmax; height: 60vmax; background: radial-gradient(circle, rgba(255, 215, 0, 0.15), transparent 70%); bottom: -30%; right: -20%; animation-duration: 18s; animation-delay: 3s; }
        @keyframes moveLight { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(15%, 15%) scale(1.3); } }

        /* الحاوية الرئيسية */
        .container {
            position: relative; z-index: 1;
            width: min(90%, 900px); height: 85dvh; max-height: 850px;
            padding: min(4vh, 40px) min(3vw, 50px);
            display: flex; flex-direction: column; align-items: center; justify-content: space-around;
            background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 60px; border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 25px 80px rgba(0,0,0,0.7), inset 0 0 50px rgba(212, 175, 55, 0.05);
        }

        /* النصوص الفاخرة */
        .text-container { text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; max-height: 40%; }
        .arabic-title {
            font-family: 'Tajawal', sans-serif; font-weight: 900;
            font-size: clamp(3rem, 7vw, 5.5rem);
            background: linear-gradient(135deg, #fff 0%, #D4AF37 30%, #fff 50%, #D4AF37 70%, #fff 100%);
            background-size: 300% 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmerText 4s ease-in-out infinite; text-shadow: 0 0 30px rgba(212, 175, 55, 0.2); line-height: 1.1;
        }
        .english-title {
            font-family: 'Poppins', sans-serif; font-weight: 600;
            font-size: clamp(1.2rem, 2.5vw, 2.2rem); color: #f5f5f5; letter-spacing: 2px; text-transform: uppercase;
            animation: fadeUp 1s ease-out forwards; opacity: 0; transform: translateY(15px); margin-top: 5px;
        }
        .sub-title { margin-top: clamp(5px, 2vh, 15px); animation: fadeUp 1.2s ease-out forwards; opacity: 0; transform: translateY(15px); display: flex; flex-direction: column; gap: 2px; }
        .sub-title .ar { font-size: clamp(1rem, 2vw, 1.6rem); color: #ccb699; }
        .sub-title .en { font-size: clamp(0.8rem, 1.2vw, 1.2rem); color: #aa9b84; }
        @keyframes shimmerText { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        /* صندوق الـ QR */
        .qr-wrapper {
            background: #ffffff; padding: clamp(12px, 2.5vw, 25px);
            border-radius: clamp(25px, 4vw, 45px);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.5), 0 0 100px rgba(212, 175, 55, 0.2);
            animation: floatBox 3s ease-in-out infinite; position: relative; flex-shrink: 0;
        }
        .qr-wrapper::after {
            content: ''; position: absolute; inset: -4px; border-radius: inherit;
            background: linear-gradient(135deg, #D4AF37, #f9d976, #b58d25); z-index: -1;
            background-size: 300% 300%; animation: shimmerBorder 3s infinite linear;
        }
        @keyframes floatBox { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes shimmerBorder { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        #qrcode img { display: block; width: clamp(180px, 30vmin, 350px) !important; height: clamp(180px, 30vmin, 350px) !important; }

        /* النص السفلي */
        .tap-hint { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; margin-bottom: clamp(5px, 1.5vh, 20px); font-size: clamp(1rem, 2vw, 1.6rem); color: #D4AF37; font-weight: 300; animation: blinkText 2s infinite; }
        .tap-hint small { display: block; color: #a08b72; font-size: clamp(0.8rem, 1.2vw, 1.2rem); font-family: 'Poppins', sans-serif; margin-top: 5px; }
        @keyframes blinkText { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* --- تأثير الفخامة الجديد (نص Thank you يملأ الشاشة) --- */
        #thank-you-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            display: flex; justify-content: center; align-items: center;
            background: rgba(47, 12, 21, 0.85); /* خلفية عنابية معتمة */
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 9999; pointer-events: none;
            opacity: 0; transform: scale(0.8);
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        #thank-you-overlay.active {
            opacity: 1; transform: scale(1);
        }
        .thank-you-text {
            font-family: 'Poppins', sans-serif; font-weight: 700;
            font-size: clamp(4rem, 15vw, 12rem); /* حجم ضخم جداً يغطي الشاشة */
            background: linear-gradient(135deg, #D4AF37 0%, #fff 40%, #D4AF37 80%, #b58d25 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: goldGlow 2s ease-in-out infinite alternate;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.6);
        }
        @keyframes goldGlow {
            0% { filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.3)); }
            100% { filter: drop-shadow(0 0 80px rgba(212, 175, 55, 0.8)); }
        }
    </style>
</head>
<body>

    <div class="bg-lights">
        <div class="light light-1"></div>
        <div class="light light-2"></div>
    </div>

    <!-- العنصر الفخم الذي يملأ الشاشة -->
    <div id="thank-you-overlay">
        <div class="thank-you-text">Thank you</div>
    </div>

    <div class="container" id="mainContainer">
        <div class="text-container">
            <div class="arabic-title">ريدان للمندي</div>
            <div class="english-title">Raidan Mandi Restaurant</div>
            <div class="sub-title">
                <span class="ar">شاركنا تجربتك لنكون الأفضل</span>
                <span class="en">Share your feedback with us</span>
            </div>
        </div>

        <div class="qr-wrapper" id="qrWrapper">
            <div id="qrcode"></div>
        </div>
        
        <div class="tap-hint">
            ✦ امسح الكود لبدء التقييم ✦
            <small>Scan the code to rate us</small>
        </div>
    </div>

    <script>
        // 1. توليد كود QR
        new QRCode(document.getElementById("qrcode"), {
            text: "https://share.google/I5qRSbag9rFWj1iw1",
            width: 300, height: 300,
            colorDark: "#2f0c15", colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // العناصر
        const overlay = document.getElementById('thank-you-overlay');

        // 2. دالة تشغيل الصوت والتأثير البصري الفخم
        function triggerPremiumEffect() {
            // أولاً: تشغيل الصوت "Thank you" بالإنجليزية
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance('Thank you');
                utterance.lang = 'en-US'; // لغة إنجليزية واضحة
                utterance.rate = 0.7; // سرعة أبطأ قليلاً ليكون مهيباً وفخماً
                utterance.pitch = 1.2; // نبرة صوت جذابة
                utterance.volume = 1;
                window.speechSynthesis.speak(utterance);
            }

            // ثانياً: إظهار الـ Overlay الفخم
            overlay.classList.add('active');

            // ثالثاً: إخفائه تلقائياً بعد 2.5 ثانية
            setTimeout(() => {
                overlay.classList.remove('active');
            }, 2500);
        }

        // تشغيل التأثير عند الضغط على الشاشة أو الـ QR
        document.body.addEventListener('click', triggerPremiumEffect);
        document.body.addEventListener('touchstart', triggerPremiumEffect);
        
        // منع تشغيل الصوت مرتين عند الضغط على الكود تحديداً
        document.getElementById('qrWrapper').addEventListener('click', function(e) {
            e.stopPropagation();
        });
    </script>
</body>
</html>
